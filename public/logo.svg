      <stop offset="0%" stop-color="#D85430" />
      <stop offset="50%" stop-color="#C04830" />
      <stop offset="100%" stop-color="#843C30" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#843C30" flood-opacity="0.25" />
