    <line x1="30" y1="24" x2="39" y2="40" stroke="#FAF6F2" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="21" y1="40" x2="39" y2="40" stroke="#FAF6F2" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- Brand Wordmark -->
  <text x="82" y="52" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="600" fill="#1F2937" letter-spacing="-0.5">
